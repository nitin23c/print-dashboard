<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Printer">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme:dark)">
<title>Printer</title>
<link rel="icon" href="data:,">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
<div class="top"><h1 id="title">&nbsp;</h1><button id="theme" type="button"></button></div>
<div id="hero" class="card hero"><span class="dot"></span><div><b>Loading…</b></div></div>
<div id="notices"></div>
<h2>Print a file</h2>
<div class="card">
  <label class="pick" id="pick"><input id="file" type="file" multiple accept="application/pdf,image/jpeg,image/png"><span id="pickLabel">Choose PDF or photo</span></label>
  <div id="options" hidden>
    <div id="files" style="margin-top:8px"></div>
    <div class="field"><span>Copies</span><span class="stepper"><button id="less" type="button" aria-label="Fewer copies">−</button><output id="copies">1</output><button id="more" type="button" aria-label="More copies">+</button></span></div>
    <label class="field" id="colorField" hidden><span>Print in colour</span><input id="useColor" type="checkbox"></label>
    <div class="actions"><button id="clear" type="button">Clear</button><button id="send" type="button" class="primary">Print</button></div>
  </div>
  <div id="sending" hidden><div class="bar"><i id="sent" style="width:0"></i></div><div id="sendNote" class="muted"></div></div>
  <div id="result" class="result" role="status"></div>
</div>
<h2>Print jobs now</h2>
<div id="jobs"></div>
<h2>Print mode</h2>
<div class="card row">
  <div><span class="name">Colour printing</span><div id="colorNote" class="muted"></div></div>
  <button id="color" class="switch" role="switch" aria-checked="false" aria-label="Colour printing"><i></i></button>
</div>
<h2>Pages printed</h2>
<div id="stats" class="stats"></div>
<h2>Recent jobs</h2>
<div id="history" class="card list"></div>
<div id="infoBlock">
<h2>Printer</h2>
<div id="info" class="card muted"></div>
</div>
<p id="updated" class="muted"></p>
</main>
<script src="/app.js"></script>
</body>
</html>
